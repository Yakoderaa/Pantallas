name: Build and Release Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pantallas-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Esperar cambios consecutivos
        if: github.event_name == 'push'
        shell: pwsh
        run: Start-Sleep -Seconds 20

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          choco install innosetup -y --no-progress

      - name: Inyectar identificador de build
        shell: pwsh
        run: |
          @"
          BUILD_ID = ${{ github.run_number }}
          BUILD_COMMIT = "${{ github.sha }}"
          "@ | Set-Content -Encoding UTF8 pantallas/build_info.py

      - name: Smoke test de imports
        shell: pwsh
        run: |
          python -m compileall -q app.py pantallas
          python -c "import pantallas.windows_api; import pantallas.rules; import pantallas.update_service; import pantallas.main_window; print('imports OK')"

      - name: Construir Pantallas.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Pantallas app.py

      - name: Construir instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion="0.2.0.${{ github.run_number }}" installer\Pantallas.iss

      - name: Generar SHA-256
        shell: pwsh
        run: |
          $file = "installer_output\PantallasSetup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  PantallasSetup.exe" | Set-Content -NoNewline -Encoding ascii "installer_output\PantallasSetup.exe.sha256"

      - name: Publicar artefacto de CI
        uses: actions/upload-artifact@v4
        with:
          name: Pantallas-Windows-build-${{ github.run_number }}
          path: |
            installer_output/PantallasSetup.exe
            installer_output/PantallasSetup.exe.sha256
          if-no-files-found: error

      - name: Publicar actualización
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          gh release create $tag "installer_output/PantallasSetup.exe" "installer_output/PantallasSetup.exe.sha256" --repo "${{ github.repository }}" --title "Pantallas build ${{ github.run_number }}" --notes "Actualización automática de Pantallas. Commit ${{ github.sha }}."
