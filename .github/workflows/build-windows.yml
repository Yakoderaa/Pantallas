name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Smoke test de imports
        shell: pwsh
        run: |
          python -m compileall -q app.py pantallas
          python -c "import pantallas.windows_api; import pantallas.rules; import pantallas.main_window; print('imports OK')"

      - name: Construir Pantallas.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Pantallas app.py

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Pantallas-Windows
          path: dist/Pantallas.exe
          if-no-files-found: error
