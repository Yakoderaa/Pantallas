name: Build and Release Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pantallas-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Esperar cambios consecutivos
        if: github.event_name == 'push'
        shell: pwsh
        run: Start-Sleep -Seconds 20

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          choco install innosetup -y --no-progress

      - name: Generar identidad Windows
        shell: pwsh
        run: |
          python tools/generate_icons.py
          if (!(Test-Path "assets\generated\pantallas.ico")) {
            throw "No se generó el icono principal."
          }

      - name: Inyectar identificador de build
        shell: pwsh
        run: |
          @"
          BUILD_ID = ${{ github.run_number }}
          BUILD_COMMIT = "${{ github.sha }}"
          "@ | Set-Content -Encoding UTF8 pantallas/build_info.py

      - name: Smoke test de Python
        shell: pwsh
        run: |
          python -m compileall -q app.py pantallas tools
          python -c "import pantallas.windows_api; import pantallas.monitor_state; import pantallas.monitor_order; import pantallas.brightness_cache; import pantallas.power_profiles; import pantallas.preferences; import pantallas.rules; import pantallas.resources; import pantallas.update_service; import pantallas.ui_theme; import pantallas.ui_pages; import pantallas.main_window; print('imports OK')"

      - name: Construir aplicación onedir
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name Pantallas --icon "assets\generated\pantallas.ico" --add-data "assets\brand;assets\brand" --add-data "assets\generated\pantallas-256.png;assets\generated" --add-data "assets\generated\pantallas-tray-256.png;assets\generated" app.py

      - name: Verificar runtime e identidad
        shell: pwsh
        run: |
          if (!(Test-Path "dist\Pantallas\Pantallas.exe")) {
            throw "Pantallas.exe no fue generado."
          }
          $pythonDll = Get-ChildItem "dist\Pantallas" -Recurse -Filter "python311.dll" | Select-Object -First 1
          if ($null -eq $pythonDll) {
            throw "python311.dll no está incluido en el paquete onedir."
          }
          if (!(Test-Path "dist\Pantallas\_internal\assets\brand\pantallas.svg") -and !(Test-Path "dist\Pantallas\assets\brand\pantallas.svg")) {
            throw "Los recursos de marca no quedaron empaquetados."
          }

      - name: Construir instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion="0.8.1.${{ github.run_number }}" installer\Pantallas.iss

      - name: Generar SHA-256
        shell: pwsh
        run: |
          $file = "installer_output\PantallasSetup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  PantallasSetup.exe" | Set-Content -NoNewline -Encoding ascii "installer_output\PantallasSetup.exe.sha256"

      - name: Publicar artefacto de CI
        uses: actions/upload-artifact@v4
        with:
          name: Pantallas-Windows-build-${{ github.run_number }}
          path: |
            installer_output/PantallasSetup.exe
            installer_output/PantallasSetup.exe.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar artefacto verificado
        uses: actions/download-artifact@v4
        with:
          name: Pantallas-Windows-build-${{ github.run_number }}
          path: release

      - name: Publicar actualización
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" release/PantallasSetup.exe release/PantallasSetup.exe.sha256 --repo "${{ github.repository }}" --title "Pantallas build ${{ github.run_number }}" --notes "Pantallas V0.8.1. Sincronización automática de estado real para monitores DDC y recuperación manual de estados pegados. Commit ${{ github.sha }}."
